<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="profile.html" class="active">Кабинет</a>
        <a href="messages.html">Сообщения</a>
        <a href="stats.html">Статистика</a>
    </nav>
    <div class="container">
        <h1>Личный кабинет</h1>
        
        <div class="card profile-info">
            <p><span>ID:</span> <span id="userId">#001</span></p>
            <p><span>Логин:</span> <span id="userLogin">membrelo</span></p>
            <p><span>Имя:</span> <span id="userName">Виктор</span></p>
            <p><span>Фамилия:</span> <span id="userSurname">Елькин</span></p>
            <p><span>Отчество:</span> <span id="userPatronymic">Александрович</span></p>
            <p><span>Телефон:</span> <span id="userPhone">+7 (999) 123-45-67</span></p>
        </div>
        
        <div class="card">
            <h3>Изменить данные</h3>
            <form action="" method="POST" id="profileForm">
                <input type="text" name="login" placeholder="Логин" value="membrelo">
                <input type="text" name="name" placeholder="Имя" value="Виктор">
                <input type="text" name="surname" placeholder="Фамилия" value="Елькин">
                <input type="text" name="patronymic" placeholder="Отчество" value="Александрович">
                <input type="tel" name="phone" placeholder="Телефон" value="+7 (999) 123-45-67">
                <input type="password" name="password" placeholder="Новый пароль">
                <input type="password" name="confirm_password" placeholder="Подтвердите пароль">
                <button type="submit">Сохранить изменения</button>
            </form>
        </div>
    </div>
    <script></script>
</body>
</html>

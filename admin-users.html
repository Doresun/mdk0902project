<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи - Админ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="admin.html">Панель управления</a>
        <a href="admin-messages.html">Сообщения</a>
        <a href="admin-users.html" class="active">Пользователи</a>
    </nav>
    <div class="container">
        <h1>Управление пользователями</h1>
        
        <div class="card">
            <h3>Список пользователей</h3>
            <div class="users-table">
                <div class="user-row header">
                    <div class="user-cell">ID</div>
                    <div class="user-cell">Логин</div>
                    <div class="user-cell">ФИО</div>
                    <div class="user-cell">Телефон</div>
                    <div class="user-cell">Действия</div>
                </div>
                <div class="user-row">
                    <div class="user-cell">#001</div>
                    <div class="user-cell">membrelo</div>
                    <div class="user-cell">Елькин Виктор Александрович</div>
                    <div class="user-cell">+7 (999) 123-45-67</div>
                    <div class="user-cell">
                        <button class="btn-edit" onclick="location.href='profile.html'">Редактировать</button>
                    </div>
                </div>
                <div class="user-row">
                    <div class="user-cell">#002</div>
                    <div class="user-cell">user123</div>
                    <div class="user-cell">Иванов Иван Иванович</div>
                    <div class="user-cell">+7 (999) 987-65-43</div>
                    <div class="user-cell">
                        <button class="btn-edit" onclick="location.href='profile.html'">Редактировать</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" id="editUserCard" style="display: none;">
            <h3>Редактирование пользователя</h3>
            <form action="" method="POST" id="editUserForm">
                <input type="hidden" name="user_id" id="editUserId">
                <input type="text" name="login" id="editLogin" placeholder="Логин">
                <input type="text" name="name" id="editName" placeholder="Имя">
                <input type="text" name="surname" id="editSurname" placeholder="Фамилия">
                <input type="text" name="patronymic" id="editPatronymic" placeholder="Отчество">
                <input type="tel" name="phone" id="editPhone" placeholder="Телефон">
                <input type="password" name="password" id="editPassword" placeholder="Новый пароль">
                <select name="role" id="editRole">
                    <option value="user">Пользователь</option>
                    <option value="admin">Администратор</option>
                </select>
                <button type="submit">Сохранить изменения</button>
            </form>
        </div>
    </div>
    <script></script>
</body>
</html>
